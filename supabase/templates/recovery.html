<!-- CentroManager — lien de mot de passe (Supabase Auth → Email Templates → Reset password). -->
<div style="font-family: Arial, Helvetica, sans-serif; color: #3b3f5c; max-width: 520px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 22px; color: #6c2bf5; margin: 0 0 16px;">Choisir un mot de passe</h1>
  <p style="font-size: 15px; line-height: 1.6; margin: 0 0 16px;">
    Cliquez sur le bouton ci-dessous pour choisir un nouveau mot de passe et accéder à votre espace CentroManager.
  </p>
  <p style="margin: 24px 0;">
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
       style="background: #6c2bf5; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; display: inline-block;">
      Choisir mon mot de passe
    </a>
  </p>
  <p style="font-size: 13px; line-height: 1.6; color: #8a90a6; margin: 0;">
    Ce lien est personnel et expire après 1 heure. Si vous n'êtes pas à l'origine de cette demande, ignorez ce message.
  </p>
</div>
